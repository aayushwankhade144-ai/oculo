<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Oculo3D — Eye Anatomy</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#03070b;
    color:#eef8ff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

#app{
    position:fixed;
    inset:0;
}

canvas{
    display:block;
    width:100%;
    height:100%;
    touch-action:none;
}

/* ---------- TOP ---------- */

.top{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:80px;
    padding:20px 28px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    z-index:10;
    pointer-events:none;
}

.logo{
    font-size:15px;
    font-weight:700;
    letter-spacing:5px;
}

.sub{
    margin-top:5px;
    font-size:8px;
    letter-spacing:3px;
    opacity:.4;
}

.online{
    font-size:8px;
    letter-spacing:2px;
    opacity:.55;
}

.dot{
    display:inline-block;
    width:6px;
    height:6px;
    margin-right:7px;
    border-radius:50%;
    background:#55e7b2;
    box-shadow:0 0 12px #55e7b2;
}

/* ---------- LEFT ---------- */

.controls{
    position:fixed;
    left:24px;
    top:105px;
    width:220px;
    padding:17px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:15px;
    background:rgba(4,10,17,.72);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    z-index:10;
}

.label{
    font-size:8px;
    letter-spacing:3px;
    opacity:.4;
    margin-bottom:12px;
}

button{
    width:100%;
    border:1px solid transparent;
    border-radius:8px;
    padding:11px;
    margin-bottom:6px;
    color:#eaf7ff;
    background:rgba(255,255,255,.045);
    text-align:left;
    font-size:9px;
    letter-spacing:1.5px;
    cursor:pointer;
}

button.active{
    border-color:rgba(75,196,255,.5);
    background:rgba(55,174,230,.13);
}

/* ---------- INFO ---------- */

.info{
    position:fixed;
    right:24px;
    bottom:24px;
    width:275px;
    padding:18px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:15px;
    background:rgba(4,10,17,.72);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    z-index:10;
}

.kicker{
    font-size:7px;
    letter-spacing:3px;
    opacity:.4;
}

.title{
    margin-top:8px;
    font-size:20px;
    font-weight:400;
}

.description{
    margin-top:8px;
    font-size:10px;
    line-height:1.6;
    opacity:.55;
}

/* ---------- CENTER ---------- */

.crosshair{
    position:fixed;
    left:50%;
    top:50%;
    width:16px;
    height:16px;
    transform:translate(-50%,-50%);
    border:1px solid rgba(130,220,255,.18);
    border-radius:50%;
    pointer-events:none;
    z-index:5;
}

.hint{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    font-size:8px;
    letter-spacing:2px;
    opacity:.3;
    pointer-events:none;
    z-index:10;
}

/* ---------- ERROR ---------- */

#error{
    display:none;
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(90%,500px);
    padding:22px;
    border:1px solid rgba(255,80,80,.4);
    border-radius:14px;
    background:#100608;
    color:#ffb4b4;
    z-index:100;
    font-family:monospace;
    font-size:12px;
    line-height:1.6;
}

/* ---------- MOBILE ---------- */

@media(max-width:700px){

    .top{
        padding:17px;
    }

    .controls{
        left:12px;
        top:auto;
        bottom:15px;
        width:150px;
        padding:11px;
    }

    .controls .label{
        margin-bottom:8px;
    }

    button{
        padding:8px;
        font-size:7px;
    }

    .info{
        right:12px;
        bottom:15px;
        width:185px;
        padding:13px;
    }

    .title{
        font-size:15px;
    }

    .description{
        font-size:8px;
    }

    .hint{
        display:none;
    }
}
</style>
</head>

<body>

<div id="app"></div>

<header class="top">
    <div>
        <div class="logo">OCULO3D</div>
        <div class="sub">INTERACTIVE OCULAR ANATOMY</div>
    </div>

    <div class="online">
        <span class="dot"></span>
        3D ENGINE ONLINE
    </div>
</header>

<aside class="controls">

    <div class="label">ANATOMICAL VIEW</div>

    <button class="active" data-view="complete">
        COMPLETE EYE
    </button>

    <button data-view="anterior">
        ANTERIOR SEGMENT
    </button>

    <button data-view="posterior">
        POSTERIOR / RETINA
    </button>

    <button data-view="optic">
        OPTIC NERVE
    </button>

    <button data-view="muscles">
        EXTRAOCULAR MUSCLES
    </button>

</aside>

<section class="info">

    <div class="kicker">SELECTED STRUCTURE</div>

    <div class="title" id="infoTitle">
        Eyeball
    </div>

    <div class="description" id="infoText">
        Drag to rotate the globe.
        Use pinch or wheel to zoom.
        Tap an anatomical structure.
    </div>

</section>

<div class="crosshair"></div>

<div class="hint">
    DRAG TO ROTATE · PINCH TO ZOOM · TAP TO INSPECT
</div>

<div id="error"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* ==========================================================
   OCULO3D
   STABLE CORE ENGINE
========================================================== */

const Oculo = {

    scene:null,
    camera:null,
    renderer:null,

    eye:null,
    sclera:null,
    cornea:null,
    iris:null,
    pupil:null,
    lens:null,
    retina:null,
    opticNerve:null,
    muscles:null,

    raycaster:new THREE.Raycaster(),
    pointer:new THREE.Vector2(),

    rotationX:0,
    rotationY:0,
    targetRotationX:0,
    targetRotationY:0,

    distance:7,
    targetDistance:7,

    dragging:false,
    moved:false,

    lastX:0,
    lastY:0,

    clock:new THREE.Clock()
};


/* ==========================================================
   ERROR HANDLER
========================================================== */

function showError(error){

    console.error(error);

    const box =
        document.getElementById("error");

    box.style.display="block";

    box.innerHTML =
        "<b>Oculo3D could not initialize.</b><br><br>" +
        String(error);
}


/* ==========================================================
   START
========================================================== */

try{

    init();

}catch(error){

    showError(error);

}


/* ==========================================================
   INITIALIZATION
========================================================== */

function init(){

    createScene();

    createCamera();

    createRenderer();

    createLighting();

    createEye();

    createOpticNerve();

    createMuscles();

    createControls();

    createUI();

    animate();
}


/* ==========================================================
   SCENE
========================================================== */

function createScene(){

    Oculo.scene =
        new THREE.Scene();

    Oculo.scene.background =
        new THREE.Color(0x03070b);

    Oculo.scene.fog =
        new THREE.Fog(
            0x03070b,
            12,
            30
        );
}


/* ==========================================================
   CAMERA
========================================================== */

function createCamera(){

    Oculo.camera =
        new THREE.PerspectiveCamera(
            40,
            window.innerWidth /
            window.innerHeight,
            .1,
            100
        );

    Oculo.camera.position.z =
        Oculo.distance;
}


/* ==========================================================
   RENDERER
========================================================== */

function createRenderer(){

    Oculo.renderer =
        new THREE.WebGLRenderer({

            antialias:true,

            powerPreference:
                "high-performance"

        });

    Oculo.renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio || 1,
            1.8
        )
    );

    Oculo.renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    Oculo.renderer.outputColorSpace =
        THREE.SRGBColorSpace;

    Oculo.renderer.toneMapping =
        THREE.ACESFilmicToneMapping;

    Oculo.renderer.toneMappingExposure =
        1.1;

    document
        .getElementById("app")
        .appendChild(
            Oculo.renderer.domElement
        );
}


/* ==========================================================
   LIGHTING
========================================================== */

function createLighting(){

    const ambient =
        new THREE.HemisphereLight(
            0x9ddfff,
            0x10151b,
            2
        );

    Oculo.scene.add(ambient);


    const key =
        new THREE.DirectionalLight(
            0xffffff,
            3
        );

    key.position.set(
        4,
        6,
        8
    );

    Oculo.scene.add(key);


    const rim =
        new THREE.PointLight(
            0x55cfff,
            10,
            20
        );

    rim.position.set(
        -5,
        2,
        -6
    );

    Oculo.scene.add(rim);
}


/* ==========================================================
   EYE
========================================================== */

function createEye(){

    Oculo.eye =
        new THREE.Group();

    Oculo.scene.add(
        Oculo.eye
    );


    /* -------------------------
       SCLERA
    ------------------------- */

    const scleraGeometry =
        new THREE.SphereGeometry(
            2.5,
            64,
            40
        );

    const scleraMaterial =
        new THREE.MeshStandardMaterial({

            color:0xe7ecef,

            roughness:.3,

            metalness:0

        });

    Oculo.sclera =
        new THREE.Mesh(
            scleraGeometry,
            scleraMaterial
        );

    Oculo.sclera.userData.name =
        "Sclera";

    Oculo.eye.add(
        Oculo.sclera
    );


    /* -------------------------
       IRIS
    ------------------------- */

    const irisGeometry =
        new THREE.CircleGeometry(
            1.05,
            64
        );

    const irisMaterial =
        new THREE.MeshStandardMaterial({

            color:0x3e758b,

            roughness:.38,

            side:THREE.DoubleSide

        });

    Oculo.iris =
        new THREE.Mesh(
            irisGeometry,
            irisMaterial
        );

    Oculo.iris.position.z =
        2.47;

    Oculo.iris.userData.name =
        "Iris";

    Oculo.eye.add(
        Oculo.iris
    );


    /* -------------------------
       PUPIL
    ------------------------- */

    const pupilGeometry =
        new THREE.CircleGeometry(
            .45,
            64
        );

    const pupilMaterial =
        new THREE.MeshBasicMaterial({
            color:0x010204,
            side:THREE.DoubleSide
        });

    Oculo.pupil =
        new THREE.Mesh(
            pupilGeometry,
            pupilMaterial
        );

    Oculo.pupil.position.z =
        2.49;

    Oculo.pupil.userData.name =
        "Pupil";

    Oculo.eye.add(
        Oculo.pupil
    );


    /* -------------------------
       CORNEA
    ------------------------- */

    const corneaGeometry =
        new THREE.SphereGeometry(
            1.35,
            48,
            32,
            0,
            Math.PI * 2,
            0,
            Math.PI / 2
        );

    const corneaMaterial =
        new THREE.MeshPhongMaterial({

            color:0xc9f4ff,

            transparent:true,

            opacity:.18,

            shininess:150,

            side:THREE.DoubleSide,

            depthWrite:false

        });

    Oculo.cornea =
        new THREE.Mesh(
            corneaGeometry,
            corneaMaterial
        );

    Oculo.cornea.rotation.x =
        Math.PI;

    Oculo.cornea.position.z =
        2.34;

    Oculo.cornea.userData.name =
        "Cornea";

    Oculo.eye.add(
        Oculo.cornea
    );


    /* -------------------------
       LENS
    ------------------------- */

    const lensGeometry =
        new THREE.SphereGeometry(
            .7,
            40,
            28
        );

    const lensMaterial =
        new THREE.MeshPhongMaterial({

            color:0xd8f5ff,

            transparent:true,

            opacity:.32,

            shininess:150,

            side:THREE.DoubleSide

        });

    Oculo.lens =
        new THREE.Mesh(
            lensGeometry,
            lensMaterial
        );

    Oculo.lens.scale.set(
        1,
        1,
        .5
    );

    Oculo.lens.position.z =
        1.55;

    Oculo.lens.userData.name =
        "Lens";

    Oculo.eye.add(
        Oculo.lens
    );


    /* -------------------------
       RETINA
    ------------------------- */

    const retinaGeometry =
        new THREE.SphereGeometry(
            2.4,
            48,
            32
        );

    const retinaMaterial =
        new THREE.MeshBasicMaterial({

            color:0x7b2838,

            side:THREE.BackSide,

            transparent:true,

            opacity:.22

        });

    Oculo.retina =
        new THREE.Mesh(
            retinaGeometry,
            retinaMaterial
        );

    Oculo.retina.userData.name =
        "Retina";

    Oculo.eye.add(
        Oculo.retina
    );
}


/* ==========================================================
   OPTIC NERVE
========================================================== */

function createOpticNerve(){

    const curve =
        new THREE.CatmullRomCurve3([

            new THREE.Vector3(
                -2.1,0,0
            ),

            new THREE.Vector3(
                -3,0,-.05
            ),

            new THREE.Vector3(
                -4.3,.2,.1
            ),

            new THREE.Vector3(
                -5.2,.1,0
            )

        ]);


    const geometry =
        new THREE.TubeGeometry(
            curve,
            32,
            .35,
            16,
            false
        );


    const material =
        new THREE.MeshStandardMaterial({

            color:0xd1a36e,

            roughness:.85

        });


    Oculo.opticNerve =
        new THREE.Mesh(
            geometry,
            material
        );

    Oculo.opticNerve.userData.name =
        "Optic Nerve";

    Oculo.eye.add(
        Oculo.opticNerve
    );
}


/* ==========================================================
   EXTRAOCULAR MUSCLES
========================================================== */

function createMuscles(){

    Oculo.muscles =
        new THREE.Group();

    Oculo.muscles.visible =
        false;


    for(let i=0;i<6;i++){

        const geometry =
            new THREE.TorusGeometry(
                2.58,
                .075,
                10,
                48,
                Math.PI*.6
            );


        const material =
            new THREE.MeshStandardMaterial({

                color:
                    new THREE.Color(
                        0.35 +
                        Math.random()*.15,
                        0.08,
                        0.12
                    ),

                roughness:.8

            });


        const muscle =
            new THREE.Mesh(
                geometry,
                material
            );


        muscle.rotation.x =
            (Math.random()-.5)*.8;

        muscle.rotation.y =
            i * Math.PI / 3;

        muscle.rotation.z =
            (Math.random()-.5)*.4;


        muscle.userData.name =
            "Extraocular Muscle";


        Oculo.muscles.add(
            muscle
        );
    }


    Oculo.scene.add(
        Oculo.muscles
    );
}


/* ==========================================================
   CONTROLS
========================================================== */

function createControls(){

    const canvas =
        Oculo.renderer.domElement;


    canvas.addEventListener(
        "pointerdown",
        e => {

            Oculo.dragging=true;
            Oculo.moved=false;

            Oculo.lastX=e.clientX;
            Oculo.lastY=e.clientY;

            canvas.setPointerCapture(
                e.pointerId
            );
        }
    );


    canvas.addEventListener(
        "pointermove",
        e => {

            if(!Oculo.dragging)
                return;


            const dx =
                e.clientX -
                Oculo.lastX;

            const dy =
                e.clientY -
                Oculo.lastY;


            if(
                Math.abs(dx)>2 ||
                Math.abs(dy)>2
            ){
                Oculo.moved=true;
            }


            Oculo.targetRotationY +=
                dx*.007;

            Oculo.targetRotationX +=
                dy*.007;


            Oculo.targetRotationX =
                THREE.MathUtils.clamp(
                    Oculo.targetRotationX,
                    -.8,
                    .8
                );


            Oculo.lastX=e.clientX;
            Oculo.lastY=e.clientY;
        }
    );


    canvas.addEventListener(
        "pointerup",
        e => {

            const wasMoved =
                Oculo.moved;

            Oculo.dragging=false;


            if(!wasMoved){

                selectStructure(
                    e.clientX,
                    e.clientY
                );
            }
        }
    );


    canvas.addEventListener(
        "wheel",
        e => {

            Oculo.targetDistance +=
                e.deltaY*.008;

            Oculo.targetDistance =
                THREE.MathUtils.clamp(
                    Oculo.targetDistance,
                    4,
                    13
                );
        },
        {passive:true}
    );


    /* PINCH ZOOM */

    let lastPinchDistance=null;


    canvas.addEventListener(
        "touchmove",
        e => {

            if(e.touches.length!==2)
                return;


            const dx =
                e.touches[0].clientX -
                e.touches[1].clientX;

            const dy =
                e.touches[0].clientY -
                e.touches[1].clientY;

            const distance =
                Math.sqrt(
                    dx*dx + dy*dy
                );


            if(lastPinchDistance!==null){

                const delta =
                    distance -
                    lastPinchDistance;

                Oculo.targetDistance -=
                    delta*.012;

                Oculo.targetDistance =
                    THREE.MathUtils.clamp(
                        Oculo.targetDistance,
                        4,
                        13
                    );
            }


            lastPinchDistance =
                distance;
        },
        {passive:true}
    );


    canvas.addEventListener(
        "touchend",
        () => {

            lastPinchDistance=null;

        },
        {passive:true}
    );
}


/* ==========================================================
   SELECT STRUCTURE
========================================================== */

function selectStructure(x,y){

    const rect =
        Oculo.renderer
            .domElement
            .getBoundingClientRect();


    Oculo.pointer.x =
        ((x-rect.left)/rect.width)*2-1;


    Oculo.pointer.y =
        -((y-rect.top)/rect.height)*2+1;


    Oculo.raycaster.setFromCamera(
        Oculo.pointer,
        Oculo.camera
    );


    const objects =
        Oculo.eye.children;


    const hits =
        Oculo.raycaster.intersectObjects(
            objects,
            true
        );


    if(!hits.length)
        return;


    let object =
        hits[0].object;


    while(
        object &&
        !object.userData.name &&
        object.parent
    ){
        object=object.parent;
    }


    if(
        object &&
        object.userData.name
    ){

        showInfo(
            object.userData.name
        );
    }
}


/* ==========================================================
   INFORMATION
========================================================== */

const information={

    "Sclera":{
        title:"Sclera",
        text:
        "The opaque fibrous coat forming most " +
        "of the outer wall of the eyeball."
    },

    "Cornea":{
        title:"Cornea",
        text:
        "The transparent anterior portion of " +
        "the fibrous coat and an important " +
        "refractive surface."
    },

    "Iris":{
        title:"Iris",
        text:
        "The pigmented diaphragm surrounding " +
        "the pupil. It regulates the amount " +
        "of light entering the eye."
    },

    "Pupil":{
        title:"Pupil",
        text:
        "The central aperture of the iris. " +
        "Its diameter changes according to " +
        "pupillary muscle activity."
    },

    "Lens":{
        title:"Lens",
        text:
        "A transparent biconvex structure that " +
        "changes shape during accommodation."
    },

    "Retina":{
        title:"Retina",
        text:
        "The neural layer of the eye containing " +
        "photoreceptors and retinal neurons."
    },

    "Optic Nerve":{
        title:"Optic Nerve",
        text:
        "Cranial nerve II. It carries visual " +
        "information from the retina toward " +
        "the central nervous system."
    },

    "Extraocular Muscle":{
        title:"Extraocular Muscles",
        text:
        "The muscles responsible for coordinated " +
        "movement of the eyeball."
    }

};


function showInfo(name){

    const data =
        information[name];

    if(!data)
        return;


    document
        .getElementById("infoTitle")
        .textContent =
            data.title;


    document
        .getElementById("infoText")
        .textContent =
            data.text;
}


/* ==========================================================
   UI MODES
========================================================== */

function createUI(){

    document
        .querySelectorAll("button")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    document
                        .querySelectorAll("button")
                        .forEach(
                            b =>
                            b.classList
                             .remove("active")
                        );

                    button.classList.add(
                        "active"
                    );


                    setView(
                        button.dataset.view
                    );
                }
            );
        });
}


function setView(view){

    Oculo.sclera.visible=true;
    Oculo.cornea.visible=true;
    Oculo.iris.visible=true;
    Oculo.pupil.visible=true;
    Oculo.lens.visible=true;
    Oculo.retina.visible=true;
    Oculo.opticNerve.visible=true;
    Oculo.muscles.visible=false;


    if(view==="anterior"){

        Oculo.retina.visible=false;
        Oculo.opticNerve.visible=false;

        showInfo(
            "Cornea"
        );
    }


    if(view==="posterior"){

        Oculo.cornea.visible=false;
        Oculo.iris.visible=false;
        Oculo.pupil.visible=false;
        Oculo.lens.visible=false;

        showInfo(
            "Retina"
        );
    }


    if(view==="optic"){

        showInfo(
            "Optic Nerve"
        );
    }


    if(view==="muscles"){

        Oculo.muscles.visible=true;

        showInfo(
            "Extraocular Muscle"
        );
    }


    if(view==="complete"){

        showInfo(
            "Sclera"
        );
    }
}


/* ==========================================================
   ANIMATION
========================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    const time =
        Oculo.clock.getElapsedTime();


    /* Smooth rotation */

    Oculo.rotationX +=
        (
            Oculo.targetRotationX -
            Oculo.rotationX
        )*.08;


    Oculo.rotationY +=
        (
            Oculo.targetRotationY -
            Oculo.rotationY
        )*.08;


    Oculo.distance +=
        (
            Oculo.targetDistance -
            Oculo.distance
        )*.08;


    Oculo.eye.rotation.x =
        Oculo.rotationX;


    Oculo.eye.rotation.y =
        Oculo.rotationY;


    Oculo.camera.position.z =
        Oculo.distance;


    Oculo.camera.lookAt(
        0,
        0,
        0
    );


    /* subtle corneal movement */

    if(Oculo.cornea){

        Oculo.cornea.material.opacity =
            .17 +
            Math.sin(time*1.3)*.015;
    }


    Oculo.renderer.render(
        Oculo.scene,
        Oculo.camera
    );
}


/* ==========================================================
   RESIZE
========================================================== */

window.addEventListener(
    "resize",
    () => {

        if(!Oculo.camera ||
           !Oculo.renderer)
            return;


        Oculo.camera.aspect =
            window.innerWidth /
            window.innerHeight;


        Oculo.camera.updateProjectionMatrix();


        Oculo.renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>
