<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0,user-scalable=no">

<title>Oculo3D — Interactive Eye Anatomy</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05080d;
    color: #eef6ff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

#app {
    position: fixed;
    inset: 0;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
}

/* ------------------------------
   HEADER
------------------------------ */

.header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;

    height: 76px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 28px;

    z-index: 20;

    pointer-events: none;

    background:
        linear-gradient(
            to bottom,
            rgba(3,7,12,.72),
            transparent
        );
}

.brand {
    pointer-events: auto;

    display: flex;
    flex-direction: column;
    gap: 3px;
}

.brand-main {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 4px;
}

.brand-sub {
    font-size: 8px;
    letter-spacing: 2px;
    opacity: .45;
}

.status {
    pointer-events: auto;

    display: flex;
    align-items: center;
    gap: 8px;

    font-size: 8px;
    letter-spacing: 2px;

    opacity: .55;
}

.status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #55e7b2;
    box-shadow:
        0 0 10px #55e7b2;
}

/* ------------------------------
   LEFT PANEL
------------------------------ */

.panel {
    position: fixed;

    left: 24px;
    top: 100px;

    width: 220px;

    padding: 18px;

    z-index: 20;

    border:
        1px solid rgba(255,255,255,.09);

    border-radius: 14px;

    background:
        rgba(7,12,20,.58);

    backdrop-filter:
        blur(16px);

    -webkit-backdrop-filter:
        blur(16px);

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.25);
}

.panel-title {
    font-size: 9px;
    letter-spacing: 3px;
    opacity: .45;
    margin-bottom: 15px;
}

.layer {
    width: 100%;

    padding: 10px 11px;

    margin-bottom: 6px;

    border:
        1px solid transparent;

    border-radius: 8px;

    background:
        rgba(255,255,255,.035);

    color: white;

    text-align: left;

    font-size: 10px;
    letter-spacing: 1px;

    cursor: pointer;

    transition:
        background .2s,
        border .2s,
        transform .2s;
}

.layer:hover {
    transform: translateX(2px);
    background:
        rgba(255,255,255,.08);
}

.layer.active {
    border-color:
        rgba(93,205,255,.35);

    background:
        rgba(60,180,230,.12);
}

/* ------------------------------
   INFO CARD
------------------------------ */

.info {
    position: fixed;

    right: 24px;
    bottom: 24px;

    width: 270px;

    z-index: 20;

    padding: 18px;

    border:
        1px solid rgba(255,255,255,.09);

    border-radius: 14px;

    background:
        rgba(7,12,20,.62);

    backdrop-filter:
        blur(16px);

    -webkit-backdrop-filter:
        blur(16px);
}

.info-kicker {
    font-size: 8px;
    letter-spacing: 3px;
    opacity: .4;
    margin-bottom: 8px;
}

.info-title {
    font-size: 19px;
    font-weight: 400;
    margin-bottom: 7px;
}

.info-text {
    font-size: 10px;
    line-height: 1.6;
    opacity: .55;
}

/* ------------------------------
   BOTTOM HINT
------------------------------ */

.hint {
    position: fixed;

    left: 50%;
    bottom: 25px;

    transform:
        translateX(-50%);

    z-index: 20;

    font-size: 8px;
    letter-spacing: 2px;

    opacity: .3;

    pointer-events: none;
}

/* ------------------------------
   LOADER
------------------------------ */

.loader {
    position: fixed;
    inset: 0;

    z-index: 100;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #05080d;

    transition:
        opacity .8s ease;
}

.loader-inner {
    text-align: center;
}

.loader-name {
    font-size: 26px;
    letter-spacing: 8px;
    font-weight: 300;
}

.loader-line {
    width: 130px;
    height: 1px;

    margin: 16px auto;

    background:
        rgba(255,255,255,.15);

    overflow: hidden;
}

.loader-progress {
    height: 100%;
    width: 0%;

    background: #79d9ff;

    transition: width .8s ease;
}

.loader-small {
    font-size: 7px;
    letter-spacing: 3px;
    opacity: .35;
}

/* ------------------------------
   MOBILE
------------------------------ */

@media (max-width: 700px) {

    .header {
        padding: 0 17px;
    }

    .panel {
        left: 12px;
        top: auto;
        bottom: 18px;

        width: 145px;

        padding: 11px;

        border-radius: 12px;
    }

    .panel-title {
        margin-bottom: 8px;
    }

    .layer {
        padding: 8px;

        font-size: 8px;
    }

    .info {
        right: 12px;
        bottom: 18px;

        width: 175px;

        padding: 13px;
    }

    .info-title {
        font-size: 15px;
    }

    .info-text {
        font-size: 8px;
    }

    .hint {
        display: none;
    }
}
</style>
</head>

<body>

<div id="app"></div>

<!-- =========================
     UI
========================= -->

<header class="header">

    <div class="brand">
        <div class="brand-main">
            OCULO3D
        </div>

        <div class="brand-sub">
            INTERACTIVE OCULAR ANATOMY
        </div>
    </div>

    <div class="status">
        <span class="status-dot"></span>
        3D ENGINE ONLINE
    </div>

</header>


<aside class="panel">

    <div class="panel-title">
        ANATOMICAL LAYERS
    </div>

    <button
        class="layer active"
        data-layer="eye">
        COMPLETE EYE
    </button>

    <button
        class="layer"
        data-layer="anterior">
        ANTERIOR SEGMENT
    </button>

    <button
        class="layer"
        data-layer="retina">
        RETINA
    </button>

    <button
        class="layer"
        data-layer="optic">
        OPTIC NERVE
    </button>

    <button
        class="layer"
        data-layer="muscles">
        EXTRAOCULAR MUSCLES
    </button>

</aside>


<section class="info">

    <div class="info-kicker">
        SELECTED STRUCTURE
    </div>

    <div
        class="info-title"
        id="structureTitle">
        Globe
    </div>

    <div
        class="info-text"
        id="structureText">
        Rotate and zoom the eye to explore
        its three-dimensional anatomy.
    </div>

</section>


<div class="hint">
    DRAG TO ROTATE · PINCH TO ZOOM · TAP STRUCTURES
</div>


<!-- =========================
     LOADER
========================= -->

<div class="loader" id="loader">

    <div class="loader-inner">

        <div class="loader-name">
            OCULO3D
        </div>

        <div class="loader-line">
            <div
                class="loader-progress"
                id="progress">
            </div>
        </div>

        <div class="loader-small">
            INITIALIZING OCULAR MODEL
        </div>

    </div>

</div>


<!-- =========================
     THREE.JS
========================= -->

<script
src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js">
</script>

<script>

"use strict";


/* =========================================================
   OCULO3D ENGINE
========================================================= */

const App = {

    scene: null,

    camera: null,

    renderer: null,

    clock: new THREE.Clock(),

    eye: null,

    cornea: null,

    iris: null,

    pupil: null,

    lens: null,

    retina: null,

    opticNerve: null,

    muscles: null,

    raycaster:
        new THREE.Raycaster(),

    pointer:
        new THREE.Vector2(),

    targetRotationX: 0,

    targetRotationY: 0,

    rotationX: 0,

    rotationY: 0,

    targetDistance: 8,

    distance: 8,

    dragging: false,

    previousPointerX: 0,

    previousPointerY: 0,

    selected: null

};


/* =========================================================
   INIT
========================================================= */

function init() {

    updateProgress(10);

    createScene();

    updateProgress(25);

    createCamera();

    updateProgress(40);

    createRenderer();

    updateProgress(55);

    createLights();

    updateProgress(65);

    createEye();

    updateProgress(80);

    createAnatomy();

    updateProgress(92);

    createControls();

    createInterface();

    updateProgress(100);

    setTimeout(() => {

        const loader =
            document.getElementById("loader");

        loader.style.opacity = "0";

        setTimeout(() => {

            loader.remove();

        }, 800);

    }, 700);
}


/* =========================================================
   SCENE
========================================================= */

function createScene() {

    App.scene =
        new THREE.Scene();

    App.scene.background =
        new THREE.Color(0x05080d);

    App.scene.fog =
        new THREE.FogExp2(
            0x05080d,
            .025
        );
}


/* =========================================================
   CAMERA
========================================================= */

function createCamera() {

    App.camera =
        new THREE.PerspectiveCamera(
            42,
            window.innerWidth /
            window.innerHeight,
            .1,
            100
        );

    App.camera.position.set(
        0,
        0,
        App.distance
    );
}


/* =========================================================
   RENDERER
========================================================= */

function createRenderer() {

    App.renderer =
        new THREE.WebGLRenderer({
            antialias: true,
            alpha: false,
            powerPreference:
                "high-performance"
        });

    App.renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );

    App.renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    App.renderer.outputColorSpace =
        THREE.SRGBColorSpace;

    App.renderer.toneMapping =
        THREE.ACESFilmicToneMapping;

    App.renderer.toneMappingExposure =
        1.15;

    document
        .getElementById("app")
        .appendChild(
            App.renderer.domElement
        );
}


/* =========================================================
   LIGHTING
========================================================= */

function createLights() {

    const ambient =
        new THREE.HemisphereLight(
            0x8fdcff,
            0x080b10,
            1.7
        );

    App.scene.add(ambient);


    const key =
        new THREE.DirectionalLight(
            0xffffff,
            3.2
        );

    key.position.set(
        -4,
        6,
        8
    );

    App.scene.add(key);


    const rim =
        new THREE.PointLight(
            0x3da9ff,
            12,
            20
        );

    rim.position.set(
        -5,
        2,
        -5
    );

    App.scene.add(rim);
}


/* =========================================================
   MAIN EYE
========================================================= */

function createEye() {

    App.eye =
        new THREE.Group();

    App.scene.add(
        App.eye
    );


    /* -------------------------
       SCLERA
    ------------------------- */

    const scleraGeometry =
        new THREE.SphereGeometry(
            2.5,
            64,
            40
        );

    const scleraMaterial =
        new THREE.MeshPhysicalMaterial({

            color: 0xe8edf0,

            roughness: .28,

            metalness: 0,

            clearcoat: .2,

            clearcoatRoughness: .2

        });

    const sclera =
        new THREE.Mesh(
            scleraGeometry,
            scleraMaterial
        );

    sclera.userData.structure =
        "Globe";

    App.eye.add(sclera);


    /* -------------------------
       IRIS
    ------------------------- */

    const irisGeometry =
        new THREE.CylinderGeometry(
            1.05,
            1.05,
            .08,
            64
        );

    const irisMaterial =
        new THREE.MeshPhysicalMaterial({

            color: 0x4b7f92,

            roughness: .35,

            metalness: .05,

            transparent: true,

            opacity: .96

        });

    App.iris =
        new THREE.Mesh(
            irisGeometry,
            irisMaterial
        );

    App.iris.rotation.x =
        Math.PI / 2;

    App.iris.position.z =
        2.43;

    App.iris.userData.structure =
        "Iris";

    App.eye.add(
        App.iris
    );


    /* -------------------------
       PUPIL
    ------------------------- */

    const pupilGeometry =
        new THREE.CylinderGeometry(
            .48,
            .48,
            .085,
            64
        );

    const pupilMaterial =
        new THREE.MeshBasicMaterial({
            color: 0x020306
        });

    App.pupil =
        new THREE.Mesh(
            pupilGeometry,
            pupilMaterial
        );

    App.pupil.rotation.x =
        Math.PI / 2;

    App.pupil.position.z =
        2.49;

    App.pupil.userData.structure =
        "Pupil";

    App.eye.add(
        App.pupil
    );


    /* -------------------------
       CORNEA
    ------------------------- */

    const corneaGeometry =
        new THREE.SphereGeometry(
            1.32,
            64,
            40,
            0,
            Math.PI * 2,
            0,
            Math.PI / 2
        );

    const corneaMaterial =
        new THREE.MeshPhysicalMaterial({

            color: 0xdff8ff,

            transparent: true,

            opacity: .18,

            roughness: .03,

            transmission: .25,

            thickness: .08,

            clearcoat: 1,

            clearcoatRoughness: .02,

            depthWrite: false

        });

    App.cornea =
        new THREE.Mesh(
            corneaGeometry,
            corneaMaterial
        );

    App.cornea.position.z =
        2.35;

    App.cornea.rotation.x =
        Math.PI;

    App.cornea.userData.structure =
        "Cornea";

    App.eye.add(
        App.cornea
    );


    /* -------------------------
       LENS
    ------------------------- */

    const lensGeometry =
        new THREE.SphereGeometry(
            .72,
            48,
            32
        );

    const lensMaterial =
        new THREE.MeshPhysicalMaterial({

            color: 0xd9f7ff,

            transparent: true,

            opacity: .35,

            roughness: .03,

            transmission: .7,

            thickness: .25,

            clearcoat: 1

        });

    App.lens =
        new THREE.Mesh(
            lensGeometry,
            lensMaterial
        );

    App.lens.scale.set(
        1,
        1,
        .45
    );

    App.lens.position.z =
        1.55;

    App.lens.userData.structure =
        "Lens";

    App.eye.add(
        App.lens
    );


    /* -------------------------
       RETINA
    ------------------------- */

    const retinaGeometry =
        new THREE.SphereGeometry(
            2.38,
            64,
            40
        );

    const retinaMaterial =
        new THREE.MeshBasicMaterial({

            color: 0x6d2430,

            transparent: true,

            opacity: .12,

            side:
                THREE.BackSide

        });

    App.retina =
        new THREE.Mesh(
            retinaGeometry,
            retinaMaterial
        );

    App.retina.userData.structure =
        "Retina";

    App.eye.add(
        App.retina
    );


    /* -------------------------
       OPTIC NERVE
    ------------------------- */

    const nerveCurve =
        new THREE.CatmullRomCurve3([

            new THREE.Vector3(
                -2.1,
                0,
                0
            ),

            new THREE.Vector3(
                -3.0,
                -.15,
                -.05
            ),

            new THREE.Vector3(
                -4.2,
                .15,
                .1
            )

        ]);

    const nerveGeometry =
        new THREE.TubeGeometry(
            nerveCurve,
            24,
            .38,
            16,
            false
        );

    const nerveMaterial =
        new THREE.MeshStandardMaterial({

            color: 0xd3a66e,

            roughness: .8

        });

    App.opticNerve =
        new THREE.Mesh(
            nerveGeometry,
            nerveMaterial
        );

    App.opticNerve.userData.structure =
        "Optic Nerve";

    App.eye.add(
        App.opticNerve
    );
}


/* =========================================================
   EXTRA ANATOMY
========================================================= */

function createAnatomy() {

    App.muscles =
        new THREE.Group();

    App.muscles.visible =
        false;


    const muscleColors = [
        0x9b3b46,
        0xb04a50,
        0x8b3945,
        0xa83d4a
    ];


    for (let i = 0; i < 4; i++) {

        const geometry =
            new THREE.TorusGeometry(
                2.58,
                .09,
                10,
                64,
                Math.PI * .65
            );

        const material =
            new THREE.MeshStandardMaterial({
                color:
                    muscleColors[i],
                roughness: .7
            });

        const muscle =
            new THREE.Mesh(
                geometry,
                material
            );

        muscle.rotation.set(
            Math.random() * .4,
            i * Math.PI / 2,
            Math.random() * .3
        );

        muscle.userData.structure =
            "Extraocular Muscle";

        App.muscles.add(
            muscle
        );
    }

    App.scene.add(
        App.muscles
    );
}


/* =========================================================
   CONTROLS
========================================================= */

function createControls() {

    const canvas =
        App.renderer.domElement;


    canvas.addEventListener(
        "pointerdown",
        event => {

            App.dragging = true;

            App.previousPointerX =
                event.clientX;

            App.previousPointerY =
                event.clientY;

            canvas.setPointerCapture(
                event.pointerId
            );
        }
    );


    canvas.addEventListener(
        "pointermove",
        event => {

            if (!App.dragging)
                return;

            const dx =
                event.clientX -
                App.previousPointerX;

            const dy =
                event.clientY -
                App.previousPointerY;

            App.targetRotationY +=
                dx * .006;

            App.targetRotationX +=
                dy * .006;

            App.targetRotationX =
                THREE.MathUtils.clamp(
                    App.targetRotationX,
                    -.9,
                    .9
                );

            App.previousPointerX =
                event.clientX;

            App.previousPointerY =
                event.clientY;
        }
    );


    canvas.addEventListener(
        "pointerup",
        event => {

            App.dragging = false;

            canvas.releasePointerCapture(
                event.pointerId
            );
        }
    );


    canvas.addEventListener(
        "pointercancel",
        () => {

            App.dragging = false;

        }
    );


    canvas.addEventListener(
        "wheel",
        event => {

            App.targetDistance +=
                event.deltaY * .008;

            App.targetDistance =
                THREE.MathUtils.clamp(
                    App.targetDistance,
                    4,
                    14
                );
        },
        { passive: true }
    );


    canvas.addEventListener(
        "pointerup",
        event => {

            if (
                Math.abs(
                    event.clientX -
                    App.previousPointerX
                ) > 8
            ) return;

            selectObject(
                event.clientX,
                event.clientY
            );
        }
    );
}


/* =========================================================
   OBJECT SELECTION
========================================================= */

function selectObject(
    clientX,
    clientY
) {

    const rect =
        App.renderer
            .domElement
            .getBoundingClientRect();


    App.pointer.x =
        (
            (clientX - rect.left)
            / rect.width
        ) * 2 - 1;


    App.pointer.y =
        -(
            (clientY - rect.top)
            / rect.height
        ) * 2 + 1;


    App.raycaster.setFromCamera(
        App.pointer,
        App.camera
    );


    const objects =
        App.eye
            .children
            .filter(
                object =>
                    object.visible
            );


    const hits =
        App.raycaster.intersectObjects(
            objects,
            true
        );


    if (!hits.length)
        return;


    let object =
        hits[0].object;


    while (
        object &&
        !object.userData.structure &&
        object.parent
    ) {
        object =
            object.parent;
    }


    if (
        object &&
        object.userData.structure
    ) {

        App.selected =
            object;

        showStructure(
            object.userData.structure
        );
    }
}


/* =========================================================
   INTERFACE
========================================================= */

function createInterface() {

    document
        .querySelectorAll(".layer")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    document
                        .querySelectorAll(".layer")
                        .forEach(
                            b =>
                                b.classList
                                 .remove(
                                     "active"
                                 )
                        );

                    button.classList.add(
                        "active"
                    );

                    setLayer(
                        button.dataset.layer
                    );
                }
            );
        });
}


/* =========================================================
   LAYER MODES
========================================================= */

function setLayer(
    layer
) {

    App.eye.visible = true;

    App.cornea.visible = true;

    App.iris.visible = true;

    App.pupil.visible = true;

    App.lens.visible = true;

    App.retina.visible = true;

    App.opticNerve.visible = true;

    App.muscles.visible = false;


    switch (layer) {

        case "eye":

            showStructure(
                "Globe"
            );

            break;


        case "anterior":

            App.retina.visible = false;

            App.opticNerve.visible = false;

            showStructure(
                "Anterior Segment"
            );

            break;


        case "retina":

            App.cornea.visible = false;

            App.iris.visible = false;

            App.pupil.visible = false;

            App.lens.visible = false;

            showStructure(
                "Retina"
            );

            break;


        case "optic":

            showStructure(
                "Optic Nerve"
            );

            break;


        case "muscles":

            App.muscles.visible = true;

            showStructure(
                "Extraocular Muscles"
            );

            break;
    }
}


/* =========================================================
   INFORMATION DATABASE
========================================================= */

const anatomyInfo = {

        title: "Globe",
        text:
            "The eyeball is the organ of vision. " +
            "Its wall consists principally of " +
            "the fibrous, vascular and neural coats."
    },

    },

    "Pupil": {
        title: "Pupil",

    },

    },

    },

    "Optic Nerve": {
        title: "Optic Nerve",

    },

    "Anterior Segment": {
        title: "Anterior Segment",
        text:
            "The anterior portion of the eye includes " +
            "the cornea, anterior chamber, iris, pupil, " +
            "posterior chamber and lens."
    },

    "Extraocular Muscles": {
        title: "Extraocular Muscles",
        text:
            "Six principal extraocular muscles coordinate " +
            "movement of the globe."
    }

};


function showStructure(
    name
) {

    const data =
        anatomyInfo[name] ||
        anatomyInfo["Globe"];


    document
        .getElementById(
            "structureTitle"
        )
        .textContent =
            data.title;


    document
        .getElementById(
            "structureText"
        )
        .textContent =
            data.text;
}


/* =========================================================
   PROGRESS
========================================================= */

function updateProgress(
    value
) {

    document
        .getElementById(
            "progress"
        )
        .style.width =
            value + "%";
}


/* =========================================================
   ANIMATION
========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );

    const time =
        App.clock.getElapsedTime();


    /* Smooth rotation */

    App.rotationX +=
        (
            App.targetRotationX -
            App.rotationX
        ) * .08;


    App.rotationY +=
        (
            App.targetRotationY -
            App.rotationY
        ) * .08;


    App.distance +=
        (
            App.targetDistance -
            App.distance
        ) * .08;


    App.eye.rotation.x =
        App.rotationX;

    App.eye.rotation.y =
        App.rotationY;


    /* Camera */

    App.camera.position.z =
        App.distance;


    App.camera.lookAt(
        0,
        0,
        0
    );


    /* Subtle biological movement */

    App.cornea.material.opacity =
        .16 +
        Math.sin(time * 1.2)
        * .025;


    App.renderer.render(
        App.scene,
        App.camera
    );
}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        App.camera.aspect =
            window.innerWidth /
            window.innerHeight;

        App.camera.updateProjectionMatrix();

        App.renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        App.renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio,
                2
            )
        );
    }
);


/* =========================================================
   START
========================================================= */

init();

</script>

</body>
</html>
